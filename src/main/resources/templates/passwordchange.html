<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="base::layout(~{::section})">
<head>
	<meta charset="UTF-8" />
	<title>Change Password page</title>
</head>
<body>
	<section>
		
	<div class="banner2"></div> <!-- Background Image -->
	
	<div>
		<div class="logincard">
			
			
			
			
			<div class="card-body">
				
				<h3 class="mt-4 text-white">Enter new password</h3>
				<form method="post" action="" th:action="@{/changepass}">
				
				
				<div class="form-group">
				
				<input name="newpassword" type="password" placeholder="Enter new password here" class="form-control" required="required"/>
				
				</div>
				
				
				<div class="container text-center">
				
				<button class="btn btn-primary">Change Password </button>
				
				</div>
				</form>
				
			</div>
		
		</div>
	</div>
</div>

	</section>
</body>
</html>
