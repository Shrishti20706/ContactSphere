<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="base::layout(~{::section})">
<head>
	<meta charset="UTF-8" />
	<title>login page</title>
</head>
<body>
	<section>
		
	<div class="banner2"></div> <!-- Background Image -->
	
	<div>
		<div class="logincard">
		
		
		<!--  ********   message box   ********** -->
<div th:if="${session.message}" class="container">
    <div class="alert-danger my-2 text-center" role="alert">
        <span th:text="${session.message}"></span>
    </div>
    <th:block th:text="${@sessionHelper.removeMessageFromSession()}"></th:block>
</div>
		
			<div class="card-header">
				<h3 class="text-center">Your Registered Email </h3>
				
			</div>
			
			
			<div class="card-body">
				
				<form method="post" action="" th:action="@{/sendotp}">
				
				
				<div class="form-group">
				
				<input name="email" type="email" placeholder="Enter email here" class="form-control" required="required"/>
				
				</div>
				
				
				<div class="container text-center">
				
				<button class="btn btn-warning">Send OTP</button>
				
				</div>
				</form>
				
			</div>
		
		</div>
	</div>
</div>

	</section>
</body>
</html>
