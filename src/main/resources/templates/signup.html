<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="base::layout(~{::section})">
<head>
<meta charset="UTF-8" />
<title>Signup page</title>
</head>
<body>
	<section>
	
		<div class="container">
		<div class="row">
		<div class="col-md-6">
	<img alt="" th:src="@{/image/signup.png} " class="register">
	</div>
			
			
			
				<div class="col-md-6 mt-4">
				<div class="mycard ">
				<div th:if="${session.message}" th:classappend="${session.message.type}" class="alert" role="alert">
    <p class="text-center" th:text="${session.message.content}"></p>
        <th:block th:text="${@sessionHelper.removeMessageFromSession()}"></th:block>
    
</div>

					<h2 class="text-center">SignUp Here</h2>

					<form novalidate="novalidate" action="" th:action="@{/do_register}" method="post" th:object="${user}">
					
<!--  *******   name field ********** -->
					
						<div class="form-group">
						
							<label for="name_field"> Your Name</label> <input name="name" type="text" class="form-control" th:classappend="${#fields.hasErrors('name')?'is-invalid':''}" id="name_field" aria-describedby="emailHelp" placeholder="Enter name" required th:value="${user.name}">
												<div class="invalid-feedback" th:each="e:${#fields.errors('name')}" th:text="${e}"></div>
						
						</div>
<!--  *******   email field ********** -->
<div class="form-group">
    <label for="email_field"> Your Email</label> 
    <input name="email" type="email" class="form-control" th:classappend="${#fields.hasErrors('email')?'is-invalid':''}" id="email_field" aria-describedby="emailHelp" placeholder="Enter Email" required th:value="${user.email}">
    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
</div>

						
<!--  *******   password field ********** -->
					
						<div class="form-group">
						
							<label for="password_field"> Password</label> <input name="password" type="password" class="form-control" th:classappend="${#fields.hasErrors('password')?'is-invalid':''}" id="password_field" aria-describedby="emailHelp" placeholder="Enter password" required th:value="${user.password}">
							<div class="invalid-feedback" th:each="e:${#fields.errors('password')}" th:text="${e}"></div>
						</div>

<!--  *******   about field ********** -->
					
						<div class="form-group">
						<textarea name="about" th:text="${user.about}" placeholder=" Enter something about you" id=""  rows="6" class="form-control" th:value="${user.about}"></textarea>
						
						
<!-- **********  terms & conditions  *************** -->

<div class="form-group form-check">

<input type="checkbox" name="agreement" class="form-check-input" id="agreement"/>
<label for="agreement">Accept terms and conditions</label>
</div>
							
						</div>
						<div class="container text-center">
						<button type="submit" class="bg-custom text-white btn">Submit</button>
	<button type="reset" class="bg-warning text-white btn">Reset</button>
						</div>
	
					</form>
				</div>
				</div>		
				
									
			</div>
		</div>
	</section>
</body>
</html>
