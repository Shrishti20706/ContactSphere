<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="base::layout(~{::section})">
<head>
	<meta charset="UTF-8" />
	<title>otp page</title>
</head>
<body>
	<section>
		
	<div class="banner2"></div> <!-- Background Image -->
	
	<div>
		<div class="logincard">
			<div class="alert alert-success mt-3" role="alert">
			We have sent OTP to your email
			</div>
			
			
					<!--  ********   message box   ********** -->
<div th:if="${session.message}" class="container">
    <div class="alert-danger my-2 text-center" role="alert">
        <span th:text="${session.message}"></span>
    </div>
    <th:block th:text="${@sessionHelper.removeMessageFromSession()}"></th:block>
</div>
			
			
			<div class="card-body">
				
				<form method="post" action="" th:action="@{/verifyotp}">
				
				
				<div class="form-group">
				
				<input name="otp" type="text" placeholder="Enter OTP here" class="form-control" required="required"/>
				
				</div>
				
				
				<div class="container text-center">
				
				<button class="btn btn-success">Verify OTP</button>
				
				</div>
				</form>
				
			</div>
		
		</div>
	</div>
</div>

	</section>
</body>
</html>
