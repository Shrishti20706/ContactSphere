<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="normal/base::layout(~{::section})">
<head>
	<meta charset="UTF-8" />
	<title>User Dashboard</title>
</head>
<body>
<section>

<div class="card mr-3 ml-3" th:if=${contact}>
<h1 class="text-center p-3">Contact Details</h1>

<div class="card-body" >

<div class="container text-center">

 <img class="myprofpic" style="height:200px;width:200px;" alt="" th:src="@{'/image/'+${contact.image}}" src="profile photo">

<h3 class="mt-3" ><span th:text="${contact.name}"></span> ( <span th:text="${contact.secondName}"></span> )</h3>

<table class="table">
  <thead>
    <tr>
      <th scope="col">ID</th>
      <th scope="col" ><span th:text="${'24CS'+contact.cID}"></span></th>     
    </tr>
  </thead>
  <tbody>
  
    <tr>
      <th scope="row">Email</th>
      <td><span th:text="${contact.email}"></span></td>     
    </tr>
    
    
    <tr>
      <th scope="row">Phone</th>
      <td><span th:text="${contact.phone}"></span></td>     
    </tr>
    
    <tr>
      <th scope="row">Work</th>
      <td><span th:text="${contact.work}"></span></td>     
    </tr>
    
      
  </tbody>
  </table>
  
  <hr>
  <div class="description">
  <th:block th:utext="${contact.description}"></th:block>
  </div>
  
  <div class="container mt-3">
<a href="#" th:attr="onclick='deleteContact(' + ${contact.cID} + ')'" class="btn btn-danger btn-sm">Delete</a>
      <form method="post" th:action="@{'/user/updatecontact/'+${contact.cID}}" class="mt-2">
            <button class="btn btn-warning btn-sm">Update</button>
      
      </form>
     
  </div>

</div>

</div>

</div>
<h2 class="text-center p-3 bg-danger text-white" th:unless="${contact}">you don't have permission to access this contact</h2>

</section>
	
	
</body>
</html>
