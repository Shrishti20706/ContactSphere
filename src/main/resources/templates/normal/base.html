
<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />

	<link rel="stylesheet" th:href="@{/css/style.css}"/>

    <title >Dashboard</title>
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    
  </head>
  <body>
    
    
    <!-- ************   navbar  ****************** -->
    
    
    
    <nav class="fixed-top navbar navbar-expand-lg navbar-dark bg-custom font-weight-bold">
  <a class="navbar-brand" href="#">ContactSphere</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarSupportedContent">
    
    <ul class="navbar-nav ml-auto text-uppercase">
      <li class="nav-item active">
        <a class="nav-link" th:href="@{/}" href="#">Home <span class="sr-only">(current)</span></a>
      </li>
      
     
      <li class="nav-item">
        <a class="nav-link"  href="#" tabindex="-1" aria-disabled="true"><span th:text="${user.name}"></span></a>
      </li>
      <li class="nav-item">
        <a class="nav-link"  th:href="@{/logout}" href="#" tabindex="-1" aria-disabled="true">Logout</a>
    </ul>
    </li>
    
  </div>
</nav>

<!-- ******************   sidebar      *********** -->
<div class="sidebar mt-2">
  <span onclick="toggleSidebar()" class="cross_btn">&times;</span>
  <a id="home" href="#" th:href="@{/user/index}" class="item active"><i class="fas fa-home"></i> <span class="item-text">Home</span></a>
  <a id="contact" href="#" th:href="@{/user/showcontact/0}"class="item "><i class="fas fa-id-card-alt"></i> <span class="item-text">View Contacts</span></a>
  <a id="addcontact" href="#" th:href="@{/user/add_contact}" class="item "><i class="fas fa-pencil-alt"></i> <span class="item-text">Add Contact</span></a>
  <a id="profile" href="#" th:href="@{/user/profile}" class="item "><i class="fas fa-user-circle"></i> <span class="item-text">Your Profile</span></a>
  <a id="settings" href="#" th:href="@{/user/settings}" class="item "><i class="fas fa-cogs"></i> <span class="item-text">Settings</span></a>
  <a id="" href="#" th:href="@{/logout}" class="item"><i class="fas fa-sign-out-alt"></i> <span class="item-text">Logout</span></a>

  <div class="divider"></div>
</div>


<!-- ******************   end sidebar      *********** -->


<!-- ******************   content area      *********** -->

<div class="content mt-5">

	<i onclick="toggleSidebar()" class="fas fa-bars m-3"></i>
	
	<!--  ********   message box   ********** -->
<div th:if="${session.message}" class="container">
    <div th:classappend="${'alert-'+session.message.type}" class="alert text-center" role="alert">
        <span th:text="${session.message.content}"></span>
    </div>
    <th:block th:text="${@sessionHelper.removeMessageFromSession()}"></th:block>
</div>


<div th:replace="${content}"></div>

</div>





    <!-- Optional JavaScript -->
    
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <!-- <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>-->
    
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
  	<script th:src="@{/js/script.js}"></script>
  	<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
  	<script>
  	function deleteContact(cID)
  	{
  		swal({
  		  title: "Are you sure?",
  		  text: "you wanted to delete ths contact!!!",
  		  icon: "warning",
  		  buttons: true,
  		  dangerMode: true,
  		})
  		.then((willDelete) => {
  		  if (willDelete) {
  		   window.location="/user/delete/"+cID;
  		  } else {
  		    swal("Your contact is safe:)");
  		  }
  		});
  		
  	}
  	</script>
  </body>
</html>
