<!doctype html>
<html lang="en"xmlns:th="http://www.thymeleaf.org"
	th:replace="normal/base::layout(~{::section})">
<head>
	<meta charset="UTF-8" />
	<title>Your Contacts</title>
</head>
<body>
	<section>
	<div class="card mr-3 ml-3 addcon" >
	<div class="card-body">
		<h1>Your Contacts</h1>
		
		<!-- *************  search   ********** -->
		
		<div class="search-container my-3">
                <input onkeyup="search()" id="search-input" type="text" class="form-control text-center"
                       placeholder="search your contact"/>


                <!-- result goes here -->


                <div class="search-result">

                </div>
            </div>
            <div class="table-responsive">
	<table class="table table-hover">
  <thead>
    <tr>
      <th class="head" scope="col">Id</th>
      <th class="head" scope="col">Name</th>
      <th class="head" scope="col">Email</th>
      <th class="head" scope="col">Phone</th>
      <th class="head" scope="col">Action</th>
      
    </tr>
  </thead>
  <tbody>
    
    <tr th:each="c:${contacts}">
      <th scope="row" th:text="${'24CS'+c.cID}"></th>
      <td >
      <img class="myprofpic"alt="" th:src="@{'/image/'+${c.image}}" src="profile photo">
      <span th:text="${c.name}"></span>
      </td>
      <td>
<a th:href="@{'/user/' + ${c.cID} + '/contact'}">
      <span  th:text="${c.email}"></span>
      </a>
      </td>
      <td th:text="${c.phone}"></td>
      <td >
	  <a href="#" th:attr="onclick='deleteContact(' + ${c.cID} + ')'" class="btn btn-danger btn-sm">Delete</a>
       <form method="post" th:action="@{'/user/updatecontact/'+${c.cID}}" class="mt-2">
            <button class="btn btn-warning btn-sm">Update</button>
      
      </form>
      
      </td>
      
      
    </tr>
  </tbody>
</table>
</div>


<!-- ***************  pagination  ****************** -->
<div class="d-flex justify-content-center">
<nav aria-label="Page navigation example ">
  <ul class="pagination">
    <li th:if="${currentpage!=0}" class="page-item"><a  class="page-link" href="#" th:href="@{'/user/showcontact/'+${currentpage-1}}"> << </a></li>
    
    <li th:classappend="${currentpage==i-1?'active':''}" th:each="i:${#numbers.sequence(1,totalpage)}" class="page-item"><a class="page-link" href="#"th:href="@{'/user/showcontact/'+${i-1}}" ><span th:text="${i}"></span></a></li>
    
    <li th:if="${currentpage+1!=totalpage}" class="page-item"><a class="page-link"  th:href="@{'/user/showcontact/'+${currentpage+1}}" href="#"> >> </a></li>
  </ul>
</nav>
</div>

	</div>
	</div>
	<script>
$(document).ready(()=>{
	$('.item').removeClass('active');
	$("#contact").addClass("active");
});



</script>
	</section>
</body>
</html>
