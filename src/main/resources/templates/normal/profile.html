<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="normal/base::layout(~{::section})">
<head>
	<meta charset="UTF-8" />
	<title>User Dashboard</title>
</head>
<body>
<section>
<div class="container">
<div class="card ">
<div class="card-body back">
<div class="container text-center">
 <img class="myprofpic" style="height:200px;width:200px;" alt="" th:src="@{'/image/'+${user.imageUrl}}" src="profile photo">

</div>

<h1 class="text-center" th:text="${user.name}"></h1>
<table class="table">
  <thead>
    <tr>
      <th scope="col">User ID</th>
      <th scope="col" ><span th:text="${'24CS'+user.id}"></span></th>     
    </tr>
  </thead>
  <tbody>
  
    <tr>
      <th scope="row">Email</th>
      <td><span th:text="${user.email}"></span></td>     
    </tr>
    
    
    <tr>
      <th scope="row">Role</th>
      <td><span th:text="${user.role}"></span></td>     
    </tr>
    
    <tr>
      <th scope="row">Account Active</th>
      <td><span th:text="${user.enabled}"></span></td>     
    </tr>
    
     <tr>
      <th scope="row">About you</th>
      <td><span th:text="${user.about}"></span></td>     
    </tr>
    
      
  </tbody>
  </table>
</div>
</div>


  
</div>

<script>
$(document).ready(()=>{
	$(".item").removeClass("active");
	$("#profile").addClass("active");
});



</script>
</section>
	
	
</body>
</html>
